name: Typed M3 catalog trial

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'catalog-typed-*/**'
      - 'settings.gradle.kts'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'ui-builder.policy.json'
      - 'ui-builder/designs/**'
      - 'scripts/validate-typed-m3-catalog.sh'
      - 'scripts/validate-typed-m3-catalogs.sh'
      - 'samples-catalog/**'
      - 'scripts/verify-typed-m3-runtime.mjs'
      - '.github/workflows/typed-catalog.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: m3-catalog
      # Source-only API/renderer seams: immutable pins until their coordinates are released. The
      # v2.52.0 tools release carries the real-record discovery, export projections and the
      # Material icon codec the definitions in `typed/real` use; the v3.109.0 builder reads them
      # (`compose-component-records`, builtin implementations), as wear-m3-catalog's pilot pins.
      - uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: 9310fba0525c3d146736f23aa95626cac5ac8e21 # v2.52.0
          path: compose-ai-tools
      - uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ui-builder
          ref: 34701265c982e3fb50f7d2f91332a705cff84bd7 # v3.109.0
          path: compose-ui-builder
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
      - name: Validate parallel generation and renderer
        working-directory: m3-catalog
        run: xvfb-run -a scripts/validate-typed-m3-catalog.sh
      - name: Validate complete M3 samples pair
        working-directory: m3-catalog
        run: scripts/validate-typed-m3-catalogs.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: typed-m3-catalog-trial
          path: |
            m3-catalog/catalog-typed-generator/build/catalog/
            m3-catalog/catalog-typed-generator/build/reports/tests/
            m3-catalog/catalog-typed-policy/build/catalog/
            m3-catalog/catalog-typed-adapters/build/catalog/
            m3-catalog/catalog-typed-adapters/build/distributions/
            m3-catalog/catalog-typed-adapters/build/reports/tests/
            m3-catalog/catalog-typed-policy/build/reports/tests/
            m3-catalog/catalog-typed-host/build/reports/tests/
            m3-catalog/catalog-typed-adapters/build/render-evidence/
            m3-catalog/catalog-typed-adapters/build/browser-evidence/
