name: Resolve Figma refs

# Print the proposed `figma:<fileKey>/<nodeId>` ref for each catalogued component, so the handles
# can be pasted onto `@CatalogComponent(reference = …)` and design-parity has something to compare.
#
# This is a manual, read-only job rather than part of the pipeline, and deliberately so: the
# resolver *proposes* matches by name similarity against the kit's own taxonomy ("Button - tonal",
# "Connected button group"), which doesn't always agree with M3's documented component names. A
# proposal wants a human to confirm it before it becomes the reference a parity report is judged
# against. Nothing here writes to the repo.
#
# FIGMA_TOKEN is a read-only PAT with `file_content:read` — the scope that covers
# /v1/files/:key/components, /v1/files/:key/nodes and /v1/images.

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Figma file key to resolve against (defaults to the Material 3 Design Kit).'
        type: string
        default: ocdacdEsnHipMJD3egzxKb

permissions:
  contents: read

jobs:
  resolve:
    name: Propose refs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.1

      # Investigation aid for #3 / #2: the kit's full inventory per page, deeper than the resolver
      # walks, plus the type/visibility/radius of every ref already in use. Needs no Gradle.
      - name: Dump inventory
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          node scripts/dump-figma-inventory.mjs --file "$FIGMA_FILE" --depth 8 \
            --out figma-inventory.json | tee figma-inventory.txt

      # The index is an INPUT to design-map.json, so it going stale is silent:
      # a variant the kit gained reads as "no counterpart in the kit" rather
      # than "nobody looked since". Rebuild it here and fail on a difference —
      # this workflow already holds the token and has just walked the file.
      - name: Is figma-kit-index.json current?
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          node scripts/build-kit-index.mjs --file "$FIGMA_FILE" \
            --inventory figma-inventory.json --out figma-kit-index.json
          if ! git diff --quiet -- figma-kit-index.json; then
            echo "::error title=Kit index is stale::The kit has changed since figma-kit-index.json was built. Run: node scripts/build-kit-index.mjs --inventory figma-inventory.json"
            git --no-pager diff --stat -- figma-kit-index.json
            exit 1
          fi
          echo "✓ figma-kit-index.json matches the kit."

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: figma-inventory
          path: |
            figma-inventory.json
            figma-inventory.txt
          if-no-files-found: warn

      # The resolver reads the discovered manifest, so the annotations are the list of things to
      # resolve — same single source of truth the catalog itself is built from.
      - name: Discover previews
        run: ./gradlew :catalog:composePreviewDiscover --stacktrace

      - name: Resolve
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          # Through env rather than interpolated into the script: `${{ inputs.file }}` expands
          # before bash sees the line, so a dispatch input containing shell metacharacters would
          # run as part of this step. The dump step above already reads it this way.
          FIGMA_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          if [ -z "${FIGMA_TOKEN:-}" ]; then
            echo "::error::FIGMA_TOKEN secret is not set."
            exit 1
          fi
          node scripts/resolve-figma-refs.mjs --file "$FIGMA_FILE" \
            | tee figma-refs.txt

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: figma-refs
          path: figma-refs.txt
          if-no-files-found: warn
