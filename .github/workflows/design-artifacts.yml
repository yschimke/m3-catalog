name: Design Artifacts

# Render the Material 3 catalog and publish its importable bundle to the
# `design-artifacts/m3-catalog` branch, which the public preview server
# (preview.coo.ee) serves at /m3-catalog/.
#
# The whole pipeline — install CLI -> validate spec -> render -> generate ->
# publish — is the shared reusable workflow in compose-ai-tools. This repo has
# no bespoke lane, so the caller is just the `uses:` block: everything it needs
# is a generic input. If this catalog ever grows a need the reusable workflow
# cannot express, the rule is to add a generic input upstream and consume it
# from here — never to fork a copy of the pipeline.

on:
  # Weekly, so the published sheet tracks renderer changes that land upstream
  # without a change here.
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  # Republish as soon as something that changes the rendered output lands on
  # main. The paths are the render's inputs: the catalog sources themselves, the
  # spec, the dependency manifests (they carry the composePreviewPlugin pin that
  # `cli-version: catalog` resolves the CLI from — a compose-ai-tools release
  # changes the renderer itself), and this file.
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'catalog.spec.json'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/design-artifacts.yml'
  workflow_dispatch:
    inputs:
      allow_incomplete:
        description: 'Publish even if some previews fail to render or lack semantics (use while tuning the spec).'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: design-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: m3-catalog
    # Don't let forks push to the delivery branch.
    if: ${{ github.repository == 'yschimke/m3-catalog' }}
    permissions:
      contents: write
    uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@main
    with:
      system: m3-catalog
      spec: catalog.spec.json
      module: ':catalog'
      # Keep the render CLI lockstep with the applied Gradle plugin — the pin is
      # `composePreviewPlugin` in libs.versions.toml, and a CLI/plugin skew
      # breaks preview discovery outright.
      cli-version: catalog
      catalog-key: composePreviewPlugin
      # The kit's component-definition sheets place their components over a shared backdrop.
      # Include overlapping layers in the Figma export so the published Spec lane carries that
      # authored context instead of a transparent component silhouette.
      figma-contents-only: false
      # A CMP desktop (Skiko) module, so the render runs on the desktop backend.
      desktop-render: true
      # Carry the executable bundle and split it per preview, so preview.coo.ee
      # can hold a live Compose session and re-render any sticker on demand
      # (`serve --allow-render-trusted`) instead of only replaying baked PNGs.
      # This is what makes the interactive lane in CatalogInteractive.kt real,
      # and what the theme / knob overrides need in order to redraw anything.
      publish-live-bundle: true
      split-per-preview: true
      commit-user-name: Yuri Schimke
      commit-user-email: yuri@schimke.ee
      timeout-minutes: 90
      # `bundle pack`'s OWN timeout, not the job's. The two are independent, and this is the one a
      # growing sheet hits first: at 287 previews the render blew the reusable workflow's 600s
      # default and died as a bare "Build timed out after 600s", several steps before the publish it
      # never reached, while the job itself sat at ~12% of its 90 minutes.
      #
      # The exhaustive sweep is now complete at ~1150 previews, and since compose-ai-tools#3548 the
      # captures draw on a warm renderer: re-measured on CI, the render costs ~100s fixed plus
      # ~0.39s per preview (see docs/PARALLEL_RENDER.md §9), so today's serial render is ~9 min —
      # it was ~48 min under the old per-capture JVM fork. This budget is therefore ~4x more
      # generous than it looks, and deliberately so: it exists to catch a hung render, not to pace
      # a healthy one, and the sheet is expected to keep growing.
      render-timeout: 2400
      # ONE, and now for a cost reason rather than a correctness one.
      #
      # The correctness blocker is gone. Sharding used to cost this catalog three quarters of its
      # renders — 267 captured of 1095 assigned, 235 merged, silently, on a green run — because
      # `--exclude-preview-id` matched by equality OR substring and a base id is a substring of its
      # own variant ids (`…SwitchOn_Light` matches `…SwitchOn_Light_VARIANT_off`), so a shard
      # excluding another shard's base preview deleted the variants it was itself assigned. The
      # matchers learned an anchored `=<id>` form in compose-ai-tools#3561 and the pipeline emits it
      # in #3570, and the reusable workflow now hard-errors up front if the resolved CLI predates
      # that. Turning this back up is safe.
      #
      # It is just not worth it. Re-measured on CI after compose-ai-tools#3548 moved captures onto a
      # warm renderer (issue #3559), a single-job render is ~100s fixed + ~0.39s per preview — the
      # marginal term fell 6.5x while the fixed term did not move, which pushes the optimal shard
      # count DOWN, not up. A shard carries ~150s of its own fixed cost (job prefix, its own
      # discovery, Gradle prologue, upload) plus a ~85s merge job, so at ~1150 previews:
      #
      #   N=1  ~9.1 min      N=2  ~7.6 min      N=4  ~5.8 min      N=6  ~5.2 min
      #
      # Four shards buy ~3 min of wall clock for three extra runners and ~8 extra runner-minutes,
      # while the serial render sits at under a quarter of the 2400s render-timeout above. The old
      # "six, not sixteen" answer came from the pre-#3548 model and does not survive it.
      #
      # Raise this when the sheet does: sharding starts paying around 3000 previews and is necessary
      # near 6000, where a serial render meets render-timeout. The machinery stays wired and tested
      # for that. Each shard renders its own partition of the discovered ids (sorted, round-robined)
      # by excluding the rest, then `compose-preview bundle merge` unions the shard bundles back into
      # the one a serial render would have produced. See compose-ai-tools
      # docs/design/DESIGN_CATALOGS.md, "Sharding the render across parallel jobs", and
      # docs/PARALLEL_RENDER.md here.
      render-shards: 1
      allow-incomplete: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_incomplete }}
    secrets:
      # Publishes the `figma:` entries in design-map.json as **design references** on the delivery
      # branch (`references/index.json` + one normalised reference image each), which is what feeds
      # the preview server's PNG ↔ Design reference lane. Without it those entries are skipped with
      # a warning and the catalog still publishes — but a visitor gets no side-by-side against the
      # kit, which is most of the point of mapping them.
      #
      # This is a DIFFERENT surface from the design-parity/main branch: that carries the triptych
      # reports and verdicts as its own artifact branch, and the preview server does not serve it.
      # design-map.json feeds both.
      #
      # Safe to name only because the reusable workflow declares `figma_token` in its
      # `on.workflow_call.secrets`. GitHub rejects a named secret the called workflow does not
      # declare, and the run fails to parse before any job starts — so keep that in mind if the
      # `@main` pin ever moves to a ref without the declaration.
      figma_token: ${{ secrets.FIGMA_TOKEN }}
