name: Design Artifacts

# Render this repo's catalogs and publish their importable bundles to the
# `design-artifacts/<system>` branches, which the public preview server
# (preview.coo.ee) serves at /<system>/:
#
#   :catalog            -> design-artifacts/m3-catalog        the kit rendition (Material 3)
#   :samples-catalog    -> design-artifacts/m3-samples        the AndroidX samples, vendored
#   :ui-samples-catalog -> design-artifacts/compose-ui-samples the AndroidX FOUNDATION samples
#   :foundation-catalog -> design-artifacts/compose-foundation  the UI builder's own vocabulary
#
# Four catalogs, one pipeline, and a per-lane scope so a push that moves one does not spend runners
# re-rendering the others.
#
# The samples sheet's caller is deliberately the shorter of the two: it reproduces no Figma kit, so
# every input the kit rendition spends on the design-reference lane is absent rather than merely
# unset. See `docs/design/ANDROIDX_SAMPLES.md`.
#
# The whole pipeline — install CLI -> validate spec -> render -> generate ->
# publish — is the shared reusable workflow in compose-ai-tools. This repo has
# no bespoke lane, so the caller is just the `uses:` block: everything it needs
# is a generic input. If this catalog ever grows a need the reusable workflow
# cannot express, the rule is to add a generic input upstream and consume it
# from here — never to fork a copy of the pipeline.

on:
  # Weekly, so the published sheet tracks renderer changes that land upstream
  # without a change here.
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  # Republish as soon as something that changes the rendered output lands on
  # main. The paths are the render's inputs: the catalog sources themselves, the
  # spec, the dependency manifests (they carry the composePreviewPlugin pin that
  # `cli-version: catalog` resolves the CLI from — a compose-ai-tools release
  # changes the renderer itself), and this file.
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'catalog-ui-builder-renderer/**'
      - 'catalog.spec.json'
      # What this catalog declares about itself to the UI builder: the shelf a component is
      # filed under, the record an id binds to, the frame, the platform word. It is as much a
      # render input as the spec — `composePreviewDiscover` reads it and its overrides reach
      # the published `ui-builder.json` — and it was missing here, so a policy-only change
      # edited the published catalog without republishing it. Caught in the Wear sibling,
      # where two shelf corrections merged and triggered no run at all; this repository's
      # policy carries 28 such overrides and had the same gap.
      - 'ui-builder.policy.json'
      # The catalog's design guidelines, published beside the policy for the UI builder's check. A
      # guidelines-only edit must republish just as a policy-only edit does.
      - 'ui-builder.guidelines.json'
      - 'ui-builder/**'
      # The samples sheet's render inputs. `samples-catalog/**` is the vendored tree and the
      # generated spec; `samples/**` is the import manifest, the patches and the quarantine list,
      # which decide what is in that tree at all; `sample-map.json` is the @sample KDoc map the
      # spec's groups are built from. The generator is listed because a change to it moves the
      # published inventory with no input change at all.
      - 'samples-catalog/**'
      - 'samples/**'
      - 'sample-map.json'
      - 'scripts/samples-spec.mjs'
      # The foundation samples sheet's render inputs: the vendored tree, the generated wrappers and
      # the generated spec live under the module, the pin and the quarantine list beside them, and
      # the two generators are listed for the reason `scripts/samples-spec.mjs` is above — a change
      # to either moves the published inventory with no change to the module at all.
      - 'ui-samples-catalog/**'
      - 'scripts/samples-previews.mjs'
      - 'scripts/ui-samples-spec.mjs'
      # The builder vocabulary catalog: the stickers and its two authored files, plus the generator
      # that writes the policy's `builtins` block and the golden it writes them from. A change to
      # either of those last two moves the published `ui-builder.json` — which IS this catalog's
      # payload — with no change to the module at all.
      - 'foundation-catalog/**'
      - 'scripts/foundation-catalog.mjs'
      # The page-backdrop opt-in and its page list. Changing which screens are
      # published — or turning the surface on or off — changes what the delivery
      # branch carries, so it belongs in the same set as the spec.
      - 'design-pages.json'
      # And the import itself. `design-pages.json` says *which* pages; this is
      # the cache the publisher actually copies into the bundle, refreshed by
      # `figma-pages.yml` on its own schedule rather than by a source edit. The
      # first import landed here without a republish precisely because only the
      # config was listed — the surface stayed 404 on a main that had every byte
      # of it committed. A refreshed SVG is a changed published page, so it is
      # as much a render input as the spec.
      - 'design/pages/**'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/design-artifacts.yml'
      # The lane table the Scope job runs. It belongs here as well as in the mapper's own
      # SHARED_RE: this list decides whether the workflow STARTS, and SHARED_RE decides which lanes
      # publish once it has. In one and not the other, a mapping change either starts a run that
      # scopes to nothing, or — as here — never starts one at all, so the fan-out it declares can
      # never fire. The same trap `ui-builder.policy.json` above was caught in.
      - 'scripts/scope-systems.sh'
  workflow_dispatch:
    inputs:
      # The manual remedy for one stale lane should cost one render, not every catalog here.
      # Comma-separated delivery-branch slugs; empty means all. `scripts/scope-systems.sh --list`
      # prints the accepted names, and an unknown one fails the Scope job loudly rather than
      # quietly reporting that lane false.
      systems:
        description: 'Comma-separated systems to republish (empty = all). e.g. m3-catalog,m3-samples'
        type: string
        required: false
        default: ''
      allow_incomplete:
        description: 'Publish even if some previews fail to render or lack semantics (use while tuning the spec).'
        type: boolean
        default: false

permissions:
  contents: read

# NO concurrency here at all — not at the workflow level, and not on the lane jobs either. Both
# are the reusable workflow's now (`supersede-stale-runs` below), and a caller-side group would
# defeat them.
#
# The workflow-level bucket was compose-ai-tools#5438: `cancel-in-progress: false` protects the
# IN-PROGRESS run, not the PENDING one, so a newly queued run evicted the one already waiting and
# the evicted run's catalogs were never re-rendered. The per-lane `cancel-in-progress: false` groups
# that replaced it fixed the eviction across lanes but made a push WAIT behind the older run of its
# own lane — 38175941118, the fix for a broken config, sat pending behind 38175677237, which was
# doomed to fail on the old one. A caller's job-level group wraps the whole called workflow, so
# while it existed the reusable workflow never saw the two runs side by side.
#
# Inside the reusable workflow, per lane: a newer run's render shards and merge CANCEL the older
# run's, and the publish QUEUES — a started publish always finishes, because it is three pushes
# (catalog, source marker, history) and cutting between them would leave the marker or the timeline
# a publish behind. A cancelled render is safe for the reason the scope below gives: the marker
# still names what the lane was last published from, so the next run re-renders it.

jobs:
  # WHICH delivery branches does this run have to regenerate? Decided per lane, inside the reusable
  # workflow's `driver` job (`scope-mapper` below), from this repository's lane table
  # (`scripts/scope-systems.sh`) — not by a `Scope` job here.
  #
  # The `paths:` filter above decides whether the workflow runs at all; the scope decides which
  # catalogs inside it do. A render is 15-30 minutes, so a `catalog/**`-only push must not drag
  # unrelated sheets through one for a change they cannot see.
  #
  # The logic is compose-ai-tools' `scope-step.sh`, and its predicate is per LANE: is this lane's
  # last rendered source an ancestor of HEAD, and did anything in its input set change since? The
  # reusable workflow records that commit on every successful publish as
  # `refs/design-artifacts/source/<system>`, so a dropped or superseded run is picked up by the NEXT
  # push whatever that push touched. Every unresolvable answer still regenerates — publishing a fresh
  # bundle is never wrong, skipping a stale one is.
  #
  # It used to be a `Scope` job here, in front of every lane. That job ran for twelve seconds and
  # cost a full runner-queue wait — 11 of the 134.5 minutes of green run 38136351633 — before any
  # lane could start. `driver` is a job every lane pays for anyway, so the decision now rides on it:
  # a lane that scopes out stops at `driver`, a few seconds of a runner each.
  publish:
    name: m3-catalog
    # Don't let forks push to the delivery branch.
    if: ${{ github.repository == 'yschimke/m3-catalog' }}
    permissions:
      contents: write
    # No `concurrency:` — see the note above `jobs:`. `supersede-stale-runs` is the lane's group.
    # PINNED TO compose-ai-tools#5887's head until a release carries `scope-mapper` and
    # `supersede-stale-runs`; move all four lanes to that tag before merging. v2.50.0 rejects both
    # inputs at parse time.
    uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@5da325f55adbf37cd2b52e304799df0d66a6d758
    with:
      system: m3-catalog
      # The scope and the concurrency, both inside the reusable workflow (see above `jobs:`).
      scope-mapper: scripts/scope-systems.sh
      scope-only: ${{ inputs.systems }}
      supersede-stale-runs: true
      artifact-repository: yschimke/m3-catalog-out
      spec: catalog.spec.json
      # Sharding operates within one Gradle module. Every published preview in this repository is
      # owned by :catalog; keep this explicit so the reusable workflow can partition its preview
      # ids across the four render jobs below.
      module: ':catalog'
      # Properties every render must hold, checked against the merged render's data products
      # before anything publishes. See the file's $comment.
      render-assertions: render-assertions.json
      # Keep the render CLI lockstep with the applied Gradle plugin — the pin is
      # `composePreviewPlugin` in libs.versions.toml, and a CLI/plugin skew
      # breaks preview discovery outright.
      cli-version: catalog
      catalog-key: composePreviewPlugin
      # A CMP desktop (Skiko) module, so the render runs on the desktop backend.
      desktop-render: true
      # Carry the executable bundle and split it per preview, so preview.coo.ee
      # can hold a live Compose session and re-render any sticker on demand
      # (`serve --allow-render-trusted`) instead of only replaying baked PNGs.
      # This is what makes the interactive lane in CatalogInteractive.kt real,
      # and what the theme / knob overrides need in order to redraw anything.
      publish-live-bundle: true
      # Build the catalog-owned protocol-v2 canvas against the source-only renderer SDK. The
      # reusable workflow verifies and publishes the immutable ZIP, then declares its manifest
      # identity on this exact catalog generation.
      ui-builder-runtime-task: ':catalog-ui-builder-renderer:rendererArchive'
      ui-builder-runtime-archive: 'catalog-ui-builder-renderer/build/distributions/m3-catalog-ui-builder-renderer.zip'
      ui-builder-runtime-source-ref: 'c5a245386e24366f3c789a9398f599bff86fa744'
      # Pure editable SVGs are a daemon data product too. Keep them transient through catalog
      # generation and per-preview cover cropping, then produce/cache them only when requested;
      # raster-backed hybrid SVGs remain static so their crop references stay self-contained.
      defer-figma-svg: true
      # No per-preview split. Even pooled, the split is the bulk of this delivery branch: every
      # publish writes ~1,300 addressable copies under bundle/previews (52 MB of manifests and
      # baked stickers), and because any catalog edit rewrites the sheet they are all rewritten
      # each time, forcing a fresh delta chain per publish on an intentionally append-only branch
      # (see README, "The delivery branch's history is intentional"). The module-level live bundle
      # carried by `publish-live-bundle` above is what the trusted serve host actually hydrates,
      # so the interactive lane in CatalogInteractive.kt and the theme / knob overrides keep
      # working through the catalog daemon rather than through per-preview bundles.
      #
      # The history this replaces, for anyone reconsidering: `full` wrote 828,091,478 bytes across
      # 1,296 bundles, 97.8% of it the same 625,114-byte app.jar repeated;
      # `full-shared-classpath` cut that to 52,192,691 bytes plus one pool blob (789.7 MB ->
      # 50.4 MB, 15.7x). Turning the split off removes the remaining 50 MB and its per-publish
      # rewrite. Ported from meshcore-mobile#461.
      #
      # `split-mode` is dropped with it — it only has meaning when `split-per-preview` is set.
      split-per-preview: false
      commit-user-name: Yuri Schimke
      commit-user-email: yuri@schimke.ee
      timeout-minutes: 90
      # `bundle pack`'s OWN timeout, not the job's. The two are independent, and this is the one a
      # growing sheet hits first: at 287 previews the render blew the reusable workflow's 600s
      # default and died as a bare "Build timed out after 600s", several steps before the publish it
      # never reached, while the job itself sat at ~12% of its 90 minutes.
      #
      # The exhaustive page-cell mapping in #231 raised discovery from ~1150 to 4133 previews. Its
      # first serial Design Artifacts run remained in `Render catalog bundle` beyond 37 minutes,
      # leaving almost no headroom under this 40-minute bound. Four shards below bring the render
      # back inside the budget; the timeout remains a hung-render backstop rather than a target.
      #
      # The bound applies per shard to the whole semantics pass too, not per render. Once the
      # daemon had heap enough to load the manifest again (#569), shards 2–4 of run 38169265214
      # captured semantics at ~2.75s per preview, needed ~47 minutes for their ~1035 previews, and
      # every render still queued at 40 minutes failed at once — so the publish refused an incomplete
      # catalog. Fifty minutes keeps a backstop with headroom under the 90-minute job.
      render-timeout: 3000
      # FOUR: the catalog has crossed the threshold where serial rendering no longer fits safely.
      #
      # The correctness blocker is gone. Sharding used to cost this catalog three quarters of its
      # renders — 267 captured of 1095 assigned, 235 merged, silently, on a green run — because
      # `--exclude-preview-id` matched by equality OR substring and a base id is a substring of its
      # own variant ids (`…SwitchOn_Light` matches `…SwitchOn_Light_VARIANT_off`), so a shard
      # excluding another shard's base preview deleted the variants it was itself assigned. The
      # matchers learned an anchored `=<id>` form in compose-ai-tools#3561 and the pipeline emits it
      # in #3570, and the reusable workflow now hard-errors up front if the resolved CLI predates
      # that. Turning this back up is safe.
      #
      # And it is now OBSERVABLE, which is the half that made the original bug expensive: the
      # partition was correct, the plan cross-check printed `6 shard(s) cover 1095 preview(s) exactly
      # once` and was true, and the run went green with 828 renders missing, because nothing compared
      # the merged bundle back against what the shards said they would render. compose-ai-tools#3885
      # adds that comparison after the merge, so a shard that loses work fails the run naming the
      # shard and the ids instead of publishing a thinner catalog. Raising this now risks wall clock,
      # not silent coverage loss.
      #
      # At ~1150 previews a warm serial renderer was still the economical choice. The measured
      # model was ~100s fixed + ~0.39s per preview, while every shard added ~150s of setup/upload
      # and the merge added ~85s:
      #
      #   N=1  ~9.1 min      N=2  ~7.6 min      N=4  ~5.8 min      N=6  ~5.2 min
      #
      # Four shards then bought only ~3 minutes for three extra runners. At 4133 previews the first
      # serial run after #231 instead spent more than 37 minutes in the render step alone, against
      # the 2400s limit above. The marginal work now dominates the fixed shard and merge costs, so
      # four is the conservative point that restores useful timeout headroom without jumping to six
      # runners for a relatively small further wall-clock gain (#235).
      #
      # Each shard renders its own partition of the discovered ids (sorted, round-robined) by
      # excluding the rest, then `compose-preview bundle merge` unions the shard bundles back into
      # the one a serial render would have produced. The reusable workflow checks both exact plan
      # coverage and merged completeness, so parallelism cannot silently publish a thinner sheet.
      # See compose-ai-tools
      # docs/design/DESIGN_CATALOGS.md, "Sharding the render across parallel jobs", and
      # docs/PARALLEL_RENDER.md here.
      #
      # SIX since the semantics pass came back (see `render-timeout` above): at ~2.75s per preview
      # four shards of ~1035 each ran past the bound, and six of ~690 finish in about 32 minutes.
      render-shards: 6
      # Read each mapped node's STRUCTURE from the design-parity reference cache
      # (`design-parity/reference`, maintained by design-parity-import.yml) instead of asking
      # `/v1/files/:key/nodes` for it. Same JSON either way — the import wrote that branch from
      # exactly that endpoint's response.
      #
      # Worth setting because the Figma limiter is per TOKEN, not per repo or per workflow. This
      # one credential is shared by both catalogs' parity runs, both imports, and this lane in
      # both repos, and this lane was the last one still spending it unguarded: it runs on every
      # push that touches the catalog, while the kit moves rarely. All 547 `figma:` entries in
      # design-map.json are present on the branch today, so the structure half of this lane goes
      # from ~11 `/nodes` requests per run to one `?depth=1` freshness check.
      #
      # PIXELS ARE UNAFFECTED, deliberately. The cache also holds a resolution-free `image.svg`,
      # but the exports here are PNG at a per-record density and the `match` score baked into the
      # published manifest is computed from those very pixels — rasterising the SVG locally would
      # move every score in the sheet. Images keep coming from Figma's own renderer; this input
      # only removes the structure calls.
      #
      # A miss is not an error: the node falls through to the API exactly as before, so a partial
      # or absent cache costs requests, never coverage. And the cache is used only when its
      # recorded file `version` still matches the live one, because the image export below is
      # unversioned — mixing cached structure with current pixels would measure annotations
      # against one raster and draw them on another.
      reference-cache-branch: design-parity/reference
      allow-incomplete: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_incomplete }}
    secrets:
      artifacts_token: ${{ secrets.ARTIFACTS_TOKEN }}
      # Publishes the `figma:` entries in design-map.json as **design references** on the delivery
      # branch (`references/index.json` + one normalised reference image each), which is what feeds
      # the preview server's PNG ↔ Design reference lane. Without it those entries are skipped with
      # a warning and the catalog still publishes — but a visitor gets no side-by-side against the
      # kit, which is most of the point of mapping them.
      #
      # This is a DIFFERENT surface from the design-parity/main branch: that carries the triptych
      # reports and verdicts as its own artifact branch, and the preview server does not serve it.
      # design-map.json feeds both.
      #
      # Safe to name only because the reusable workflow declares `figma_token` in its
      # `on.workflow_call.secrets`. GitHub rejects a named secret the called workflow does not
      # declare, and the run fails to parse before any job starts — so keep that in mind if the
      # `@main` pin ever moves to a ref without the declaration.
      figma_token: ${{ secrets.FIGMA_TOKEN }}

  samples:
    name: m3-samples
    # Don't let forks push to the delivery branch.
    if: ${{ github.repository == 'yschimke/m3-catalog' }}
    permissions:
      contents: write
    # No `concurrency:` — see the note above `jobs:`. `supersede-stale-runs` is the lane's group.
    uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@5da325f55adbf37cd2b52e304799df0d66a6d758
    with:
      system: m3-samples
      # The scope and the concurrency, both inside the reusable workflow (see above `jobs:`).
      scope-mapper: scripts/scope-systems.sh
      scope-only: ${{ inputs.systems }}
      supersede-stale-runs: true
      artifact-repository: yschimke/m3-catalog-out
      spec: samples-catalog/catalog.spec.json
      module: ':samples-catalog'

      # NO DESIGN REFERENCES, AND THAT IS WHY THIS COMMAND EXISTS.
      #
      # The `publish` job above passes no `design-map-command` at all, which is right for it: the
      # committed map IS `:catalog`'s, and a single-catalog repo wants it used as-is. That default
      # stops being right the moment a second system publishes from the same checkout — an empty
      # input would hand `:catalog`'s Figma mappings to this sheet under its own name, every handle
      # naming a `catalog/src/...` file this module does not contain. That is the shape of
      # compose-ai-tools#4841, and the reusable workflow deletes the map before running this command
      # precisely so a caller cannot pass the check by accident.
      #
      # An empty map is the truthful answer rather than a placeholder. These are AndroidX's sample
      # call sites, not a reproduction of a published kit, so there is no node for any of them to be
      # scored against — which is also why this caller carries no `figma_token` and no
      # `reference-cache-branch`. The workflow warns that the system "will publish 0% coverage"; 0%
      # is correct here, and a warning that says so beats a number borrowed from the sheet next door.
      #
      # It runs no Gradle, unlike the job above: with zero `@CatalogComponent` annotations in the
      # module, a discover-then-project round trip is several minutes spent deriving this same empty
      # map. The inventory lives in the generated `catalog.spec.json` instead — see
      # `docs/design/ANDROIDX_SAMPLES.md` for why an imported project's inventory cannot be
      # annotated.
      design-map-command: printf '{"components":[]}\n' > design-map.json
      # Same CLI/plugin lockstep as the job above: the pin is `composePreviewPlugin` in
      # libs.versions.toml, and a CLI/plugin skew breaks preview discovery outright.
      cli-version: catalog
      catalog-key: composePreviewPlugin
      # Compose Multiplatform desktop, like `:catalog` and for the same reason — no AGP, so the
      # plugin routes it to the Skiko renderer under xvfb. It is also what keeps both sides of the
      # compare page on ONE rasteriser, so a sample beside its kit sticker shows an API-usage
      # difference and not a renderer difference. The Wear repo's samples module is the opposite
      # case: `androidx.wear.compose` ships Android-only and renders through Robolectric.
      desktop-render: true
      # LIVE — and this is the change the previous comment said would have to make its own case.
      #
      # What is granted, stated plainly: this repo's `design-artifacts/*` branches are trusted by the
      # preview server's `producers.json`, and on a box running `SERVE_ALLOW_RENDER_TRUSTED=1` (the
      # image default) trust is eligibility for SERVER-SIDE EXECUTION. Publishing a live bundle here
      # therefore means preview.coo.ee running vendored third-party Compose on request, where every
      # other trusted producer is first-party code reviewed in its own repository.
      #
      # Granted on three specifics rather than on "it is probably fine":
      #  - it is the same sandbox `:catalog`'s own code already runs in on that box, so this widens
      #    WHAT executes, not how — here the desktop/Skiko lane rather than the Wear repo's
      #    Robolectric one, since these samples compile against Compose Multiplatform;
      #  - the samples are public AndroidX source, vendored from a commit SHA this repo pins and
      #    re-fetched byte-identically on every import, so what runs is auditable and cannot drift
      #    under us between publishes;
      #  - without it a samples page is baked PNGs with no device, theme or knob control, and those
      #    are most of what makes a call site worth opening rather than reading on GitHub.
      #
      # The line this does NOT cross: `producers.json`'s own note about `compose-preview-imports`,
      # where trust means the import review and the pipeline rather than the upstream projects. That
      # registry still publishes no executable payload. This is the narrower grant — one pinned
      # upstream, imported into this repository under review — and it should stay one.
      publish-live-bundle: true
      # No per-preview split, matching the job above: it writes an addressable copy of every preview
      # onto an append-only branch on every publish, and 240 of them would grow this repository's
      # checkout for a lane nothing reads.
      split-per-preview: false
      commit-user-name: Yuri Schimke
      commit-user-email: yuri@schimke.ee
      timeout-minutes: 60
      render-timeout: 1800
      # ONE, where `:catalog` above takes four. Sharding pays on that sheet because its previews
      # multiply across mode and device axes; these 240 are one capture each, measured rather than
      # projected, and a shard's own discovery, upload and merge cost would exceed what it saves.
      render-shards: 1
      # NO `preview-annotations`. The build-free spec pre-flight scans sources for `@Preview` and
      # needs telling about multipreviews declared in another module. This module has none: every
      # published preview is the plain `androidx.compose.ui.tooling.preview.Preview`, carried by
      # upstream's own sources — verified against the vendored tree rather than assumed.
      allow-incomplete: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_incomplete }}
    secrets:
      artifacts_token: ${{ secrets.ARTIFACTS_TOKEN }}

  ui-samples:
    name: compose-ui-samples
    # Don't let forks push to the delivery branch.
    if: ${{ github.repository == 'yschimke/m3-catalog' }}
    permissions:
      contents: write
    # No `concurrency:` — see the note above `jobs:`. `supersede-stale-runs` is the lane's group.
    uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@5da325f55adbf37cd2b52e304799df0d66a6d758
    with:
      system: compose-ui-samples
      # The scope and the concurrency, both inside the reusable workflow (see above `jobs:`).
      scope-mapper: scripts/scope-systems.sh
      scope-only: ${{ inputs.systems }}
      supersede-stale-runs: true
      artifact-repository: yschimke/m3-catalog-out
      spec: ui-samples-catalog/catalog.spec.json
      module: ':ui-samples-catalog'

      # The same empty map the `m3-samples` job above explains at length, for the same reason and
      # with one more: these are AndroidX's `androidx.compose.foundation` call sites, and not only
      # is there no kit node for a `LazyColumn` sample — there is no kit for this tier at all.
      # Publishing `:catalog`'s map under this system's name would hand it Material 3 references
      # naming files this module does not contain. 0% parity coverage is the truthful number, which
      # is also why this caller carries no `figma_token` and no `reference-cache-branch`.
      design-map-command: printf '{"components":[]}\n' > design-map.json
      # Same CLI/plugin lockstep as every other caller here.
      cli-version: catalog
      catalog-key: composePreviewPlugin
      # Compose Multiplatform desktop — no AGP, so the plugin routes it to the Skiko renderer under
      # xvfb, which is also the classpath the samples were fingerprinted against.
      desktop-render: true
      # FALSE to start, unlike `m3-samples` — and deliberately, not by oversight.
      #
      # `docs/design/ANDROIDX_SAMPLES.md` records the rule: a live bundle on a trusted delivery
      # branch means preview.coo.ee executing vendored third-party Compose on request, and it is
      # granted on specifics rather than by default. The m3 samples earned it; this corpus starts
      # without it and can make its own case later. When it does, the argument is already written:
      # many foundation samples are INTERACTION demos — scroll, drag, `AnchoredDraggable` — and a
      # single frame of one says very little, which is the strongest case for a live bundle anywhere
      # in this repository (#346).
      publish-live-bundle: false
      # No per-preview split, matching every other caller: an addressable copy of 202 previews on an
      # append-only branch, rewritten on every publish, for a lane nothing reads.
      split-per-preview: false
      commit-user-name: Yuri Schimke
      commit-user-email: yuri@schimke.ee
      timeout-minutes: 60
      render-timeout: 1800
      # ONE, like `m3-samples` and unlike `:catalog`: these 202 previews are one capture each, so a
      # shard's own discovery, upload and merge cost would exceed what it saves.
      render-shards: 1
      # NO `preview-annotations`: every published preview here is the plain
      # `androidx.compose.ui.tooling.preview.Preview`, carried by upstream's own sources or by the
      # wrappers `scripts/samples-previews.mjs` generates, and there are no multipreviews at all.
      allow-incomplete: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_incomplete }}
    secrets:
      artifacts_token: ${{ secrets.ARTIFACTS_TOKEN }}

  foundation:
    name: compose-foundation
    # Don't let forks push to the delivery branch.
    if: ${{ github.repository == 'yschimke/m3-catalog' }}
    permissions:
      contents: write
    # No `concurrency:` — see the note above `jobs:`. `supersede-stale-runs` is the lane's group.
    uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@5da325f55adbf37cd2b52e304799df0d66a6d758
    with:
      system: compose-foundation
      # The scope and the concurrency, both inside the reusable workflow (see above `jobs:`).
      scope-mapper: scripts/scope-systems.sh
      scope-only: ${{ inputs.systems }}
      supersede-stale-runs: true
      artifact-repository: yschimke/m3-catalog-out
      spec: foundation-catalog/catalog.spec.json
      module: ':foundation-catalog'

      # The empty map the two samples jobs explain at length, for the same reason: this catalog
      # reproduces no Figma kit — its components are the builder's own vocabulary, and a kit
      # publishes no node for a Box — so 0% parity coverage is the truthful number and this caller
      # carries no `figma_token` and no `reference-cache-branch`.
      design-map-command: printf '{"components":[]}\n' > design-map.json
      cli-version: catalog
      catalog-key: composePreviewPlugin
      desktop-render: true
      # FALSE. What this catalog publishes that anything reads is `ui-builder.json` — fourteen
      # declarations and a shelf order — and its stickers are pictures for a palette rather than a
      # surface anyone re-renders with a device, a theme or a knob. A live bundle would carry an
      # executable payload onto a trusted branch to buy nothing.
      publish-live-bundle: false
      # No per-preview split, matching every other caller here.
      split-per-preview: false
      commit-user-name: Yuri Schimke
      commit-user-email: yuri@schimke.ee
      timeout-minutes: 45
      render-timeout: 900
      # ONE. Fourteen previews — seven stickers in light and dark — are a single warm render; a
      # shard's own setup and merge would cost more than the whole job.
      render-shards: 1
      allow-incomplete: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_incomplete }}

    secrets:
      artifacts_token: ${{ secrets.ARTIFACTS_TOKEN }}
