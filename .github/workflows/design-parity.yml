name: Design parity

# Compare the rendered catalog against the Material 3 Design Kit in Figma and
# publish the triptych report to the long-lived `design-parity/main` branch.
#
# The direction is **design-led** (`.design-parity.json`): this catalog exists to
# reproduce the published kit, so the kit is authoritative and a divergence is a
# bug in this code. That is the opposite of the component-system catalogs in
# compose-ai-tools, whose own render is the source of truth. It also has teeth
# beyond reporting — Code-to-Canvas push-back is gated on `code-led`, so
# `design-led` makes writing back to the Figma file structurally impossible.
#
# The map is not hand-written. `scripts/design-map.sh` projects it out of the
# discovered preview manifest, joining each component's
# `@CatalogComponent(reference = "figma:<fileKey>/<nodeId>")` to its light
# preview id — so adding a component to the comparison is one annotation
# argument, not a JSON edit that can drift from a renamed preview. Both halves
# of that projection are upstream now (compose-ai-tools reads the annotations,
# @design-parity/kit-index resolves the variants against the kit); the script is
# the wrapper that runs them in order.
#
# Everything below the `uses:` line — install the CLI, discover, scope the
# render, compare, publish, apply the verdict — lives in design-parity's
# reusable workflow. This file is the configuration, not a copy of the pipeline.
#
# PREREQUISITES, both of which make the run skip rather than fail while absent:
#   1. A `FIGMA_TOKEN` repository secret — a read-only personal access token
#      with `file_content:read`.
#   2. At least one `@CatalogComponent(reference = …)` naming a kit node.

on:
  push:
    branches: [main]
  # The unconditional sweep the cache below needs to be safe. A key can only
  # cover what it is told about — the runner image, the fonts it ships, the
  # renderer's own transitive deps all move without touching one — so once a
  # week the answer is recomputed from scratch whether or not anything looks
  # like it changed.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      design_parity_ref:
        description: >
          Test an UNRELEASED design-parity: a git ref of yschimke/design-parity
          to build and run instead of the published CLI. Empty runs the release,
          which is what every push does.
        type: string
        required: false
        default: ""

permissions: {}

# ONE run at a time, and every one of them finishes.
#
# The group stays global on purpose: the job appends the regenerated board to
# `design-parity/main`, so two runs publishing at once would race on the same
# branch. Serialising them is right.
#
# `cancel-in-progress` was how that serialisation was enforced, and it is the
# wrong lever: it throws the render away rather than ordering it. A push
# arriving mid-run leaves nothing published, and `design-parity/main` keeps
# reading as current while being several merges stale — a report nobody can
# trust to be fresh is worse than a slow one. Run 160 died exactly that way.
#
# Queuing gives the same one-writer guarantee without discarding the work.
# GitHub keeps only the newest *pending* run per group, so the backlog never
# grows past one waiting run: the in-flight render completes and publishes, and
# the newest commit is what runs next.
concurrency:
  group: design-parity-artifacts
  cancel-in-progress: false

jobs:
  parity:
    name: Design parity
    if: ${{ github.repository == 'yschimke/m3-catalog' }}
    uses: yschimke/design-parity/.github/workflows/design-parity-reusable.yml@main
    permissions:
      contents: write # publish the regenerated artifacts to design-parity/main
    with:
      module: ':catalog'

      # Skip the run outright when nothing that feeds the comparison has moved.
      # These are the paths whose content decides the render: the module itself,
      # the version catalog the renderer is pinned from, and the build files
      # that assemble them. Everything else in the key — the kit's file version,
      # design-map.json, the policy, the tool — the reusable workflow derives on
      # its own.
      #
      # Naming them is the point. 14 of the last 20 pushes to main touched none
      # of these (workflow edits, docs, a JSON dump), and one docs-only commit
      # cost a 1,095-preview render to produce a byte-identical board.
      cache-paths: catalog gradle build.gradle.kts settings.gradle.kts

      # Mondays, and on demand. A stale skip is the failure mode worth guarding
      # against, and this is the guard.
      force-refresh: ${{ github.event_name == 'schedule' }}

      # Empty on a push, so the pipeline that guards main is always the released
      # CLI. Set it on a dispatch to try a fix before it ships — the reusable
      # workflow builds that ref's workspaces and runs them, which is the only
      # way to exercise behaviour that needs a live Figma token and a real
      # catalog (a rate limiter, a partial refresh) rather than a fixture.
      design-parity-ref: ${{ inputs.design_parity_ref || '' }}

      # The daily import workflow owns all Figma traffic and commits a versioned, carry-forward
      # cache here. Ordinary parity runs are cache-only: no per-push API burst, no changing subset
      # of components when the token is rate-limited.
      reference-cache-branch: design-parity/reference

      # ONE job, deliberately. The render is the cost that was breaking this
      # workflow, and scoping it — not sharding — is what fixes that: the module
      # draws 1,095 previews and 77 carry a `reference`, so the reusable workflow
      # excludes the other 1,018 from the render and this drops from ~43 min to
      # ~4. Sharding divides only what is left, which is ~77 comparisons, and it
      # would add fixed runner and render overhead for only ~78 comparisons. The reference side is
      # read from the cache above, so this job makes zero Figma calls. Raise the shard count only if
      # the scoped single job stops fitting.
      shards: 1

      # Writes `catalog/build/compose-previews/previews.json` (the manifest the
      # render exclusion is derived from — the reusable workflow finds it at the
      # path `module` implies) and projects `design-map.json` out of it.
      design-map-command: >
        ./gradlew :catalog:composePreviewDiscover --stacktrace &&
        scripts/design-map.sh

      # A backstop, not a budget: the scoped render takes ~4 min. If the
      # exclusions ever stop taking effect this degrades to a full render and
      # still publishes, instead of dying with nothing to show for it.
      render-timeout: 4800
      timeout-minutes: 90
    secrets:
      figma-token: ${{ secrets.FIGMA_TOKEN }}

  # ── The Glimmer sheet ───────────────────────────────────────────────────────
  #
  # A SECOND board, on the shape wear-m3-catalog established for its Remote
  # rendition: one more job calling the same reusable workflow, given its own
  # `artifact-branch` so the two boards cannot be mistaken for one going stale.
  #
  # Where this repo differs from that precedent, and it is the whole reason this
  # job is not a copy: wear's two lanes reproduce the SAME kit, so one reference
  # cache and one import job serve both. These two reproduce DIFFERENT Figma
  # files — `ocdacdEsnHipMJD3egzxKb` for the Material 3 kit above,
  # `HKfLClZDLRyMhf4IQQLna8` for the Glimmer one — with no node in common, so
  # this lane gets a cache of its own (see `reference-cache-branch` below) and
  # `design-parity-import.yml` gets a second job to fill it.
  glimmer:
    name: Design parity (glimmer)
    if: ${{ github.repository == 'yschimke/m3-catalog' }}
    uses: yschimke/design-parity/.github/workflows/design-parity-reusable.yml@main
    permissions:
      contents: write # publish the regenerated artifacts to design-parity/glimmer
    with:
      module: ':glimmer-catalog'

      # A branch of its own. The job above publishes `design-parity/main`; two
      # boards on one branch would each look like the other had gone stale.
      artifact-branch: design-parity/glimmer

      # A CACHE of its own, and this is the input that does not carry over from
      # wear-m3-catalog. Sharing one branch between two kits would be safe on
      # content — the cache is keyed by file id and `prune` defaults off, so
      # neither import can delete the other's nodes — but not on WRITES: the
      # import job ends in a plain non-fast-forward `git push` with no retry, and
      # the workflow-level concurrency group does not serialise jobs inside one
      # run. Two importers on one branch means the second one loses its push.
      # Separate branches remove the race instead of scheduling around it, and
      # they keep a failed Material 3 import from withholding Glimmer's refs.
      reference-cache-branch: design-parity/glimmer-reference

      # Scoped to what this board is drawn from. `glimmer-design-map.json` is in
      # the list because the gate hashes `design-map.json` — the COMMITTED one,
      # which belongs to `:catalog` — before `design-map-command` has copied
      # ours into place. Without this entry the Glimmer lane's cache key would
      # track the Material 3 map: edit a Glimmer reference and the run would skip
      # on a key that never moved. Same reason wear's Remote job puts its
      # snapshot pin on the list.
      cache-paths: >-
        glimmer-catalog gradle build.gradle.kts settings.gradle.kts
        glimmer-design-map.json glimmer-figma-kit-index.json

      force-refresh: ${{ github.event_name == 'schedule' }}
      design-parity-ref: ${{ inputs.design_parity_ref || '' }}

      # FALSE, unlike the job above, and the same value `design-artifacts.yml`
      # gives this module. `androidx.xr.glimmer:glimmer` ships only as an AAR
      # with no Compose Multiplatform port, so this sheet renders through
      # Robolectric and AGP. The input DEFAULTS TO TRUE — inheriting it would
      # install Mesa and run the render under xvfb for a Skiko daemon that is
      # not the one drawing here.
      desktop-render: false

      # RED HERE WOULD MEAN "the catalog still diverges", which is not news.
      #
      # This is a design-led comparison of eight components against a kit they
      # are new to, and the lane gates nothing — there is no PR for a blocking
      # verdict to hold back. Blocking would paint main red on every run for the
      # steady state, and a signal that is always red cannot report a render
      # crash, a lost reference cache or an expired token, which is how
      # wear-m3-catalog#145 went unnoticed. The verdict still reaches the job
      # summary, a warning annotation and the reusable workflow's `blocked`
      # output.
      #
      # Revisit once the board has a baseline worth holding to: the honest
      # setting for a lane that gates a PR is the default `true`.
      block-on-verdict: false

      # No Gradle, unlike the job above. The map this board compares against is
      # generated and COMMITTED by `scripts/glimmer-design-map.sh`, and CI keeps
      # it current (#372) — so a discovery pass here would spend minutes
      # re-deriving a file the checkout already holds. The copy is the same
      # idiom `design-artifacts.yml` uses for this module: design-parity reads
      # `<repoRoot>/design-map.json` and nothing else, and this job's workspace
      # is its own, so overwriting `:catalog`'s map here reaches nothing.
      #
      # The SDK install is here because this is the only hook that runs before
      # the render, and `:glimmer-catalog` is the repo's one AGP module: it sets
      # `compileSdk = 37` and the package is `platforms;android-37.0` — NOT
      # `android-37`. Idempotent, and a no-op once a runner image ships it.
      # Identical to the step `ci.yml` carries for the same module.
      design-map-command: >
        sdkmanager="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?no Android SDK on this runner}}/cmdline-tools/latest/bin/sdkmanager" &&
        { yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true; } &&
        "$sdkmanager" 'platforms;android-37.0' &&
        cp glimmer-design-map.json design-map.json

      # ONE, and not a number to revisit soon: this sheet draws 19 previews
      # against 8 references. A shard's own setup would cost more than its slice.
      shards: 1

      render-timeout: 1800
      timeout-minutes: 60
    secrets:
      figma-token: ${{ secrets.FIGMA_TOKEN }}
