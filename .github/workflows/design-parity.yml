name: Design parity

# Compare the rendered catalog against the Material 3 Design Kit in Figma and
# publish the triptych report to the long-lived `design-parity/main` branch.
#
# The direction is **design-led** (`.design-parity.json`): this catalog exists to
# reproduce the published kit, so the kit is authoritative and a divergence is a
# bug in this code. That is the opposite of the component-system catalogs in
# compose-ai-tools, whose own render is the source of truth. It also has teeth
# beyond reporting — Code-to-Canvas push-back is gated on `code-led`, so
# `design-led` makes writing back to the Figma file structurally impossible.
#
# The map is not hand-written. `scripts/generate-design-map.mjs` projects it out
# of the discovered preview manifest, joining each component's
# `@CatalogComponent(reference = "figma:<fileKey>/<nodeId>")` to its light
# preview id — so adding a component to the comparison is one annotation
# argument, not a JSON edit that can drift from a renamed preview.
#
# Everything below the `uses:` line — install the CLI, discover, scope the
# render, compare, publish, apply the verdict — lives in design-parity's
# reusable workflow. This file is the configuration, not a copy of the pipeline.
#
# PREREQUISITES, both of which make the run skip rather than fail while absent:
#   1. A `FIGMA_TOKEN` repository secret — a read-only personal access token
#      with `file_content:read`.
#   2. At least one `@CatalogComponent(reference = …)` naming a kit node.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      design_parity_ref:
        description: >
          Test an UNRELEASED design-parity: a git ref of yschimke/design-parity
          to build and run instead of the published CLI. Empty runs the release,
          which is what every push does.
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: design-parity-artifacts
  cancel-in-progress: true

jobs:
  parity:
    name: Design parity
    if: ${{ github.repository == 'yschimke/m3-catalog' }}
    uses: yschimke/design-parity/.github/workflows/design-parity-reusable.yml@main
    permissions:
      contents: write # publish the regenerated artifacts to design-parity/main
    with:
      module: ':catalog'

      # Empty on a push, so the pipeline that guards main is always the released
      # CLI. Set it on a dispatch to try a fix before it ships — the reusable
      # workflow builds that ref's workspaces and runs them, which is the only
      # way to exercise behaviour that needs a live Figma token and a real
      # catalog (a rate limiter, a partial refresh) rather than a fixture.
      design-parity-ref: ${{ inputs.design_parity_ref || '' }}

      # ONE job, deliberately. The render is the cost that was breaking this
      # workflow, and scoping it — not sharding — is what fixes that: the module
      # draws 1,095 previews and 77 carry a `reference`, so the reusable workflow
      # excludes the other 1,018 from the render and this drops from ~43 min to
      # ~4. Sharding divides only what is left, which is ~77 comparisons, and it
      # would divide the Figma token N ways at the same time: the adapter has no
      # 429 retry and a rate-limited component produces no verdict on a green run
      # (#12). Raise this only once #12 is fixed, and only if the scoped single
      # job stops fitting.
      shards: 1

      # Writes `catalog/build/compose-previews/previews.json` (the manifest the
      # render exclusion is derived from — the reusable workflow finds it at the
      # path `module` implies) and projects `design-map.json` out of it.
      design-map-command: >
        ./gradlew :catalog:composePreviewDiscover --stacktrace &&
        node scripts/generate-design-map.mjs

      # A backstop, not a budget: the scoped render takes ~4 min. If the
      # exclusions ever stop taking effect this degrades to a full render and
      # still publishes, instead of dying with nothing to show for it.
      render-timeout: 4800
      timeout-minutes: 90
    secrets:
      figma-token: ${{ secrets.FIGMA_TOKEN }}
