name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build + discover previews
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test automated Gradle launcher
        run: .github/scripts/test-agent-gradle.sh
      # The path->delivery-branch mapping the Design Artifacts Scope job runs. A false negative here
      # silently strands a catalog on stale renders, which is not hypothetical: the hand-written job
      # this replaced omitted `compose-foundation` from its shared fan-out, so every version-catalog
      # change skipped that lane. Cheap to run, and the only thing standing between a typo in the
      # table and a sheet that quietly stops being republished.
      - name: Test the design-artifacts lane mapping
        run: scripts/test-scope-systems.sh
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble
        run: ./gradlew :catalog:assemble --stacktrace

      # The foundation samples and — the part that can actually break — the 192 `@Preview` wrappers
      # `scripts/samples-previews.mjs` generates for them. A wrapper is generated from source text,
      # so the compiler is the only thing that says whether it resolves: a sample that moves package
      # upstream, or gains a parameter, fails here and nowhere earlier.
      - name: Assemble the foundation samples
        run: ./gradlew :ui-samples-catalog:assemble --stacktrace

      # `compose-foundation` — the builder vocabulary catalog. Discovery is the contract here more
      # than anywhere: this catalog's whole payload is the `ui-builder.json` discovery writes from
      # the policy, and the `component.policy.orphaned` diagnostics it reports are what caught the
      # module's one real design constraint (the record does not reach foundation symbols).
      - name: Discover the foundation vocabulary
        run: ./gradlew :foundation-catalog:composePreviewDiscover --stacktrace

      # Discovery is the real contract for a design catalog: it is what turns the
      # `@CatalogComponent` / `@CatalogVariant` / `@ThemeCatalog` annotations into
      # the published inventory. A component that compiles but is not discovered
      # would silently vanish from the sticker sheet, so run it on every change.
      - name: Discover previews
        run: ./gradlew :catalog:composePreviewDiscover --stacktrace

      # The page cache records which exact kit nodes join to the generated map. This is a local,
      # token-free projection; letting it drift makes /pages.json under-report real coverage.
      - name: The imported page join is up to date
        run: node scripts/import-figma-pages.mjs --check

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: previews-manifest
          path: catalog/build/compose-previews/previews.json
          if-no-files-found: warn

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew test --stacktrace
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  ktfmt:
    name: ktfmtCheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - run: ./gradlew ktfmtCheck --stacktrace

  spec:
    name: Validate catalog spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: main
          path: compose-ai-tools
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      # The build-free pre-flight: resolves every spec reference against the
      # module's actual `@Preview` functions and flags PNG-less previews, before
      # the (long) render in design-artifacts.yml spends a runner discovering the
      # same problem.
      - name: validate-catalog-spec
        run: |
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs \
            --spec catalog.spec.json --module-dir catalog

      # The samples sheet's spec is GENERATED, so the first question is whether the committed file
      # still matches its generator. The step below asserted that this ran and it did not: the
      # regenerate-and-diff contract was described in this comment and enforced nowhere, which left
      # the spec free to drift from `sample-map.json`, from the vendored tree, and now from the kit
      # ids its back-links name. The sibling repository has always run it.
      - name: samples spec is current
        run: node scripts/samples-spec.mjs --check

      # `--check` above proves it matches the generator. That is a different question from whether it is CORRECT: the
      # generator reads the vendored tree for renderable samples, so a spec entry naming a preview
      # that does not exist would be a bug the regenerate-and-diff reproduces faithfully. This is
      # the check that every `preview` it names resolves to a real `@Preview`, before
      # design-artifacts.yml spends a runner discovering the same thing.
      #
      # It warns rather than fails on the reverse direction, and here that warning is expected and
      # correct: 266 `@Preview` functions are discovered against 245 in the catalog. The 21 are two
      # kinds, both outside the inventory by the generator's own rule:
      #
      #   * 18 upstream previews that are NOT `@Sampled` — `AllShapes`, `LeadingIconTabs`,
      #     `LegacySliderSample`, the scrolling-tab demos — demo previews living in the sample files
      #     that no `@sample` KDoc points at. `@Sampled` is what makes a function a sample rather
      #     than something a sample sits beside.
      #   * 3 adaptive samples that are `@Sampled` and `@Preview` but RETURN a value
      #     (`fun <T> levitateAsDialogSample(): ThreePaneScaffoldNavigator<T>`). A composable that
      #     returns a value is a state factory and draws nothing: rendering them produces a 1x1
      #     blank, so publishing them would be a card claiming a picture the sample never had.
      #
      # They still render; they land as bundle orphans rather than as catalog cards.
      - name: validate-catalog-spec (samples)
        run: |
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs \
            --spec samples-catalog/catalog.spec.json --module-dir samples-catalog

      # The foundation samples' spec is GENERATED too, from the vendored sources and the wrapper
      # classification, so the same question comes first: does the committed file still match its
      # generator? Both halves are checked, because they can go stale independently — a re-import
      # that adds a sample moves the wrappers AND the spec, and a hand edit to either would publish
      # an inventory naming a preview function nobody generated.
      - name: The foundation sample previews are current
        run: node scripts/samples-previews.mjs --check

      - name: compose-ui-samples spec is current
        run: node scripts/ui-samples-spec.mjs --check

      # And that every `preview` it names resolves to a real `@Preview`, before design-artifacts.yml
      # spends a runner discovering the same thing.
      #
      # The reverse direction warns, and the warning is expected: 5 of the 207 discovered previews
      # are upstream demo previews that are NOT `@Sampled` — the same category :samples-catalog's
      # 18 fall into. `@Sampled` is what makes a function a sample rather than something a sample
      # sits beside, so they render as bundle orphans rather than as catalog cards.
      - name: validate-catalog-spec (ui-samples-catalog)
        run: |
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs \
            --spec ui-samples-catalog/catalog.spec.json --module-dir ui-samples-catalog

      - name: validate-catalog-spec (foundation-catalog)
        run: |
          node compose-ai-tools/scripts/design-artifacts/validate-catalog-spec.mjs \
            --spec foundation-catalog/catalog.spec.json --module-dir foundation-catalog

      # The policy pre-flight, which nothing here ran until `compose-foundation` needed it. It is
      # not a JSON-Schema validator — the schema is the contract and a second implementation of it
      # would drift — it checks the subset a schema states poorly: that a builtin names a role the
      # template engine knows, that templates and the declared strategy agree, and that prose has
      # not been written inside `builtins`, where it is a parse failure rather than a schema one.
      # Both policies, because this repository now authors two.
      - name: validate-ui-builder-policy
        run: |
          node compose-ai-tools/scripts/design-artifacts/validate-ui-builder-policy.mjs \
            --policy ui-builder.policy.json
          node compose-ai-tools/scripts/design-artifacts/validate-ui-builder-policy.mjs \
            --policy foundation-catalog/ui-builder.policy.json

      # The `builtins` block of `compose-foundation`'s policy is GENERATED from a frozen golden —
      # the builder-vocabulary slice of the catalog the preview server packages, copied rather than
      # retyped — so the same question comes first: does the committed file still match it? A hand
      # edit there changes what a published m3 or wear palette is handed, with nothing to say so.
      # Build-free, so it runs on the pull request beside the spec pre-flights.
      - name: compose-foundation's builtins are current
        run: node scripts/foundation-catalog.mjs --check

      # The invariants the regenerate-and-diff above cannot state: that every declaration is the
      # packaged one field for field, that a canvas adapter is claimed only where one exists, that
      # each platform borrows the frozen set in the frozen order, and that a Wear palette is never
      # offered what its exporter refuses by name. See docs/design/FOUNDATION_CATALOG.md.
      - name: Test the compose-foundation donor
        run: node --test scripts/foundation-catalog.test.mjs

  design-map:
    name: design-map.json is current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0

      # The resolver itself is @design-parity/kit-index's to test, against its own slice of the
      # same kit. What is left here is the pair of invariants only this repo can check: that the
      # committed map and the committed index agree with each other.
      - name: Test design-map integrity
        run: node --test scripts/design-map.test.mjs

      # The kit's Hovered / Focused / Pressed values against the map that compares them, plus the
      # short list of states Compose draws nothing for (issue #91). Runs off the committed
      # design-map.json and figma-kit-index.json, so it needs neither a render nor a Figma token —
      # and it fails in both directions, so a fixed upstream gap surfaces as work to do rather than
      # as a stale excuse nobody revisits.
      - name: Test interaction-state coverage
        run: node --test scripts/interaction-coverage.test.mjs

      # Which of the kit's axis values the catalog has a picture of, and the short list it
      # knowingly does not (kit-unauthorable.json). Fails in BOTH directions: an entry naming a
      # value the kit no longer publishes, and an entry for a cell that has since been authored —
      # so an exemption cannot outlive the limitation that earned it. Reads the committed
      # design-map.json and figma-kit-index.json, so it needs no render and no Figma token.
      - name: Test kit axis coverage
        run: node --test scripts/kit-coverage.test.mjs

      # The generated exact-cell view. A generated cell is an exact kit ADDRESS, so
      # what is worth holding is that its `kitProps` is the kit variant's own name, that something
      # real drives it rather than it being a second name for the default pixels, and that the
      # annotation it lives in is attached to the sticker it claims to cross.
      - name: Test the generated exact kit cells
        run: node --test scripts/exhaustive-kit-cells.test.mjs

      # The duplicate-render scan's own logic, and the shape of the exemption
      # table it reads. The scan itself needs a render and runs in
      # compose-preview.yml; what is checkable without one is that it groups
      # renders the way it claims, and that every entry in duplicate-renders.json
      # names a live composable, a live variant cell and the issue tracking it.
      - name: Test duplicate-render declarations
        run: node --test scripts/duplicate-renders.test.mjs

      # Which pages the import covers, and what each one is called. Both answers are published URLs
      # (`/{system}/pages/{id}`), and the page list is now discovered from the Figma file rather
      # than hand-kept, so the slug rule is the only thing holding those URLs still.
      - name: Test Figma page resolution
        run: node --test scripts/import-figma-pages.test.mjs

      # The KDoc reader behind sample-map.json. A line-based reader mis-attributes about 12% of the
      # blocks that carry a `@sample` -- an annotation with line-spanning arguments between the KDoc
      # and the declaration is the confirmed cause -- so the scanner that replaces it is worth
      # holding still. See docs/design/ANDROIDX_SAMPLES.md.
      - name: Test the @sample KDoc reader
        run: node --test scripts/sample-map.test.mjs

      # The samples sheet's spec, and with it the BACK-LINK each sample carries to the kit component
      # it is a call site for. The link names the kit family's first-declared cell, which is a
      # convention rather than an accident -- so what is worth holding is that "first" is
      # deterministic (sorted paths, then file order) and that a sample whose API this catalog
      # publishes no component for carries no link at all rather than an empty one. The spec's own
      # `--check` gate is the other half: reordering a kit section re-points every sample of that
      # family and shows up as a diff to review instead of drifting silently.
      - name: Test the samples spec and its kit back-links
        run: node --test scripts/samples-spec.test.mjs

      # The ported `@Preview` wrapper generator, which is what makes a foundation samples sheet
      # possible at all: upstream annotates 7 of 73 files, so without wrappers the module publishes
      # a tenth of its corpus. What is worth holding is its REFUSALS — a sample that takes arguments
      # is a helper and gets no wrapper, one that carries `@Preview` upstream is left alone rather
      # than published twice, and a quarantined one is skipped — plus that each sample is called
      # through the package of the file that declares it, since this corpus spans two.
      - name: Test the sample preview wrappers
        run: node --test scripts/samples-previews.test.mjs

      # The inventory those wrappers are published under: one group per source file, one component
      # per rendered sample, and no `compareWith` — a `LazyColumn` sample has no kit cell to be
      # paired against.
      - name: Test the compose-ui-samples spec
        run: node --test scripts/ui-samples-spec.test.mjs

      # `.compose-preview/catalogs.json` — the registry document a box reads to decide WHICH of this
      # repository's sheets it serves and how they are presented. Both directions matter: an id with
      # no delivery branch is a 404 with nobody's name on it, and a published sheet missing from the
      # file never appears at all. It also pins the one editorial decision in that file, that
      # `compose-ui-samples` is served-but-unlisted, so flipping it is a reviewed act.
      - name: Test the served-catalog registry
        run: node --test scripts/catalogs-registry.test.mjs

      # The vendoring importer. The load-bearing behaviour is that a patch which no longer applies
      # FAILS the import rather than silently dropping the fix it carries, and that a quarantined
      # sample is a declared, checked gap rather than a permanent exclusion.
      - name: Test the samples importer
        run: node --test scripts/import-samples.test.mjs

      # design-map.json is GENERATED from the @CatalogComponent(reference = …) annotations, but it
      # is also COMMITTED, because design-artifacts.yml reads the committed copy to publish design
      # references onto the delivery branch. That combination can drift: add a reference in Kotlin,
      # forget to regenerate, and the delivery branch silently keeps publishing the old reference
      # set while the annotations say otherwise.
      #
      # So regenerate and diff. The annotations stay the single source of truth and the committed
      # file stays a faithful projection of them.
      - name: Regenerate and compare
        run: |
          set -euo pipefail
          ./gradlew :catalog:composePreviewDiscover --stacktrace
          scripts/design-map.sh
          if ! git diff --exit-code --stat -- design-map.json design-map-variants.json; then
            echo "::error::design-map.json is stale. Run: ./gradlew :catalog:composePreviewDiscover && scripts/design-map.sh"
            exit 1
          fi
