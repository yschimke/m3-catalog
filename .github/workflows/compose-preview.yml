name: Compose Preview

# Renders the catalog's @Previews on every PR and posts a before/after visual
# diff, and refreshes the baseline on every merge to main. This is the repo's
# review surface: a design catalog's diff *is* pixels, so a text-only review of
# a sticker change tells a reviewer nothing.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compose-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apply:
    name: Render previews (baseline or PR comment, auto-selected)
    runs-on: ubuntu-latest
    # The render alone is ~43 min at 1095 previews; 90 leaves room for setup and publish. Same
    # budget design-artifacts.yml carries, and for the same reason.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      - uses: yschimke/compose-ai-tools/.github/actions/apply@v1.3.0
        with:
          # Single source of truth for the renderer version: the
          # composePreviewPlugin entry in libs.versions.toml. A newer published
          # CLI auto-installed against an older applied plugin breaks preview
          # discovery outright.
          cli-version: catalog
          catalog-key: composePreviewPlugin
          only: compose
          # The action defaults to 600s, which was never resized as the sweep grew. At 1095
          # previews the measured fit in docs/PARALLEL_RENDER.md (~3.7 min fixed + ~2.15s/preview)
          # puts the render near 43 min, so every run has been dying at 10 min with the baseline
          # unrefreshed — including runs whose only change was documentation.
          #
          # 4800 matches design-artifacts.yml, which renders the same sheet. Past roughly 2400
          # previews the job timeout binds instead and sharding is the answer, not a bigger number.
          timeout: '4800'
