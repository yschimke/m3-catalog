name: Refresh Figma page backdrop

# Import a key page of the Material 3 Design Kit as a backdrop: the screen as a flat PNG, plus the
# rectangle of every component instance on it, each linked back to the code component that
# implements it via `design-map.json`. Produces `pages.json` + one PNG per page, and a
# self-contained HTML viewer.
#
# Manual and artifact-only, deliberately — the same reasoning as `figma-refs.yml`:
#
#   - It calls a third-party API and produces committed-shaped binaries. On every push that is
#     noisy and rate-limit-prone.
#   - The Figma file changes independently of this repo, so a per-PR run would report drift caused
#     by a designer against whoever happened to open the PR.
#   - Nothing is written back to the repo. Download the artifact, look at it, and commit it
#     deliberately if you want the manifest tracked.
#
# The feature is opt-in twice over and this workflow does not bypass either gate: it runs
# `design-parity-pages status` first and stops cleanly unless `design-pages.json` exists AND sets
# `"enabled": true`. A committed config with `enabled: false` is the intended "landed but dark"
# state — flipping that one boolean is the opt-in.
#
# FIGMA_TOKEN is the same read-only PAT with `file_content:read` that `figma-refs.yml` uses; the
# scope covers /v1/files/:key/nodes (structure + componentId) and /v1/images (the backdrop PNG).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version of @design-parity/page-backdrop to run.'
        type: string
        default: latest

permissions:
  contents: read

jobs:
  backdrop:
    name: Import page backdrop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.1

      # Stop before touching the network if the repo has not opted in. `status` exits 0 either way,
      # so the check is on its output rather than its exit code — an un-adopted repo is a normal
      # state, not a failure.
      - name: Check opt-in
        id: optin
        env:
          PB_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          out=$(npx --yes "@design-parity/page-backdrop@${PB_VERSION}" status)
          echo "$out"
          if ! printf '%s' "$out" | grep -q '^page backdrops are ON'; then
            {
              echo "### Page backdrop: skipped"
              echo ""
              echo '```'
              printf '%s\n' "$out"
              echo '```'
              echo ""
              echo 'Set `"enabled": true` in `design-pages.json` to turn this on.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import
        if: steps.optin.outputs.enabled == 'true'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          PB_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${FIGMA_TOKEN:-}" ]; then
            echo "::error::FIGMA_TOKEN secret is not set."
            exit 1
          fi
          npx --yes "@design-parity/page-backdrop@${PB_VERSION}" import \
            --design-map design-map.json 2>&1 | tee page-backdrop-import.txt

      # The overlay needs one PNG per code component. Rendering the catalog to get them costs
      # ~43 min (1095 previews, docs/PARALLEL_RENDER.md) — absurd for a couple of dozen images.
      # `compose-preview/main` already holds every render, refreshed on each merge to main by
      # compose-preview.yml, so this reads that instead: no Gradle, no Android SDK, no render.
      - name: Check out render baseline
        if: steps.optin.outputs.enabled == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: compose-preview/main
          path: .compose-preview-baseline

      - name: Build viewer
        if: steps.optin.outputs.enabled == 'true'
        env:
          PB_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # One `--render code=path` per component that has a baseline render. The script joins on
          # baselines.json rather than reconstructing filenames — see its header for why that
          # distinction matters. A component without a render is skipped, not fatal.
          args=()
          while IFS= read -r pair; do
            [ -n "$pair" ] && args+=(--render "$pair")
          done < <(node scripts/page-backdrop-renders.mjs --baseline-root .compose-preview-baseline)
          npx --yes "@design-parity/page-backdrop@${PB_VERSION}" view ${args[@]+"${args[@]}"}

      - name: Summarise
        if: steps.optin.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          out=$(node -e '
            const fs = require("node:fs");
            const cfg = JSON.parse(fs.readFileSync("design-pages.json", "utf8"));
            const dir = cfg.outDir ?? "design/pages";
            const m = JSON.parse(fs.readFileSync(dir + "/pages.json", "utf8"));
            for (const page of m.pages) {
              const linked = page.placements.filter((p) => p.link !== "unlinked").length;
              console.log(`#### ${page.name} — ${linked}/${page.placements.length} linked`);
              console.log("");
              console.log("| Instance | Link | Code |");
              console.log("| --- | --- | --- |");
              for (const p of page.placements) {
                console.log(`| ${p.name} | ${p.link} | ${p.code ?? "—"} |`);
              }
              console.log("");
            }
          ')
          printf '### Page backdrop\n\n%s\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          # Also to the log. The summary is the nice rendering, but it is not readable from the
          # API — only by opening the run — and the artifact lives on a host some networks block.
          # The linked count is the number this workflow exists to report, so put it where anyone
          # reading the run (or a CI log) can see it without downloading anything.
          echo "$out"

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: figma-page-backdrop
          path: |
            design/pages/
            page-backdrop-import.txt
          if-no-files-found: warn
