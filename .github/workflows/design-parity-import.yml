name: Design parity reference cache

# Import the Figma side on its own cadence. Design parity reads this committed cache and therefore
# makes zero live Figma calls on ordinary code pushes; a rate limit costs freshness, not coverage.

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      design_parity_ref:
        description: Test an unreleased yschimke/design-parity ref instead of the published CLI.
        type: string
        required: false
        default: ''

permissions: {}

concurrency:
  group: design-parity-reference-import
  cancel-in-progress: false

jobs:
  import:
    name: Material 3 Design Kit
    if: ${{ github.repository == 'yschimke/m3-catalog' }}
    uses: yschimke/design-parity/.github/workflows/design-parity-import-reusable.yml@main
    permissions:
      contents: write
    with:
      design-parity-ref: ${{ inputs.design_parity_ref || '' }}

      # THE CACHE BANKS. Stated explicitly even though `false` is the default,
      # because every other property of this branch depends on it and it is one
      # word away from not being true.
      #
      # The import checks the branch out with its `.git` intact and commits onto
      # it, so each run adds what moved and CARRIES the rest — a node already
      # cached at the kit's current version costs no Figma request. Pruning would
      # make the cache a mirror of whatever `design-map.json` names on the day it
      # runs, so a reference retargeted (as #373 retargeted six of Glimmer's) or
      # a map that regenerated short would delete imports this repository cannot
      # cheaply re-fetch — `api.figma.com` needs a token and is rate-limited.
      #
      # The cost is that superseded nodes accumulate. That is the right trade at
      # this size, and `prune: true` on a one-off dispatch is how to collect them
      # deliberately, against a map you have just seen regenerate correctly.
      prune: false

      design-map-command: >
        ./gradlew :catalog:composePreviewDiscover --stacktrace &&
        scripts/design-map.sh
      timeout-minutes: 90
    secrets:
      figma-token: ${{ secrets.FIGMA_TOKEN }}

  # The Glimmer kit, into a cache of its own.
  #
  # Two jobs rather than two entries in one, because these are two FILES:
  # `ocdacdEsnHipMJD3egzxKb` above, `HKfLClZDLRyMhf4IQQLna8` here. The importer
  # takes its node list from whatever `design-map.json` the checkout holds, so
  # one job can only ever fill one kit's worth of references.
  #
  # They do not share `design-parity/reference`, and the reason is the push
  # rather than the contents: an import ends in a plain non-fast-forward push
  # with no retry, and the `concurrency` group above serialises RUNS, not the
  # jobs within one. Two importers on one branch would race and the loser would
  # fail having already paid for its Figma traffic. Separate branches make that
  # structurally impossible, and mean a Material 3 import that fails does not
  # withhold Glimmer's refs.
  glimmer:
    name: Glimmer Design Kit
    if: ${{ github.repository == 'yschimke/m3-catalog' }}
    uses: yschimke/design-parity/.github/workflows/design-parity-import-reusable.yml@main
    permissions:
      contents: write
    with:
      design-parity-ref: ${{ inputs.design_parity_ref || '' }}
      cache-branch: design-parity/glimmer-reference

      # Banked, for the reasons the job above sets out.
      #
      # Separate branches are also what make this setting safe to change later.
      # On a SHARED branch, pruning would be actively destructive rather than
      # merely lossy: each import would prune against its own map, so the
      # Material 3 run would delete every Glimmer node for not appearing in the
      # Material 3 map, and the next Glimmer run would delete them right back.
      prune: false

      # No Gradle: the map is committed and CI keeps it current (#372), and the
      # import needs only the refs, not the code. The copy puts it under the one
      # name the importer reads.
      design-map-command: cp glimmer-design-map.json design-map.json
      timeout-minutes: 60
    secrets:
      figma-token: ${{ secrets.FIGMA_TOKEN }}
