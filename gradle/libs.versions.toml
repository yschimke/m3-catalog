[versions]
kotlin = "2.4.20"
ktfmt = "0.27.0"

# Compose Multiplatform (desktop). 1.11.x is the first line that ships
# `androidx.compose.ui.tooling.preview.PreviewWrapperProvider` on the desktop
# target, which is what `@ThemeCatalog` needs — the catalog's named themes are
# declared as wrapper providers rather than as knob strings.
#
# On the 1.12 line because material3 1.12 needs it — see below — and held on
# **1.12.x rather than the 1.13 alphas** for the same reason material3 is: the
# 1.13.0-alpha02 material3 artifact requires the 1.13.0-alpha02 runtime, and that
# pair removes APIs this catalog draws with (see the material3 comment).
#
# Every Skiko move on this line is a render-pipeline risk, not a taste. skiko
# 0.150.0 added a parameter to `Image.encodeToData` (1.12.0-beta01 was the first
# release to pull it in), and skiko resolves to ONE version across
# `composePreviewRenderClasspath`, so a renderer compiled against an older Skiko
# dies at the encoder on every capture:
# `Render failed … 'org.jetbrains.skia.Data org.jetbrains.skia.Image.encodeToData$default(…)'`
# (compose-ai-tools#4190). 1.12.0 and 1.12.1 both resolve skiko 0.150.1; the
# 1.13 alphas move to 0.153.0. The render task does not catch this — it reports
# `Rendered N preview(s)` and exits 0 having written nothing — so a bump that
# moves Skiko WILL come back green in `assemble`, `test` and `ktfmtCheck` and
# publish an empty sticker sheet. Render before merging one.
#
# The OTHER end of this line is the preview server. A published catalog's bundle records its
# classpath as Maven coordinates, and Skiko splits in two: `skiko-awt` (the `org.jetbrains.skia.*`
# bindings) and a per-platform `skiko-awt-runtime-<os>-<arch>` carrying the actual `libskiko`. Only
# the bindings are a coordinate — the native arrives as a transitive artifact — so a bundle records
# `skiko-awt` alone, and until compose-ai-tools#4236 the serve host paired those bindings with its
# OWN older `libskiko`. Moving this ref to the 1.12 line (skiko 0.148.2) against a host on 1.11.1
# (skiko 0.144.6) therefore killed every live render on preview.coo.ee with
# `UnsatisfiedLinkError: _nGetUnresolvedCodepointsCount` — a paragraph symbol 0.148.2 exports and
# 0.144.6 does not — while `assemble`, `test` and the baked stickers all stayed green. That is
# issue #159 (and compose-ai-tools#3447 before it, one Skiko symbol earlier).
#
# The host now resolves the bundle's own native, so a catalog may lead it again. What is left is
# ordinary care: after moving this ref, check `preview.coo.ee/status.json` for this catalog's
# `degradation` once the regenerated bundle is live. A dead lane is invisible from here — the baked
# PNGs keep serving and only knob/theme/device edits break.
compose-multiplatform = "1.12.1"
# `androidx.annotation.Sampled`, which every vendored AndroidX sample carries. Annotation-only and
# multiplatform, so it resolves on the desktop JVM target `:samples-catalog` builds for.
androidx-annotation = "1.10.0"
# `ViewModel` / `viewModelScope`, which two vendored AndroidX samples use. The JetBrains multiplatform
# port, so it resolves on the desktop JVM target `:samples-catalog` builds for.
jb-lifecycle = "2.11.0"
# `Dispatchers.Main` on the desktop JVM, backed by the Swing event thread. `viewModelScope` dispatches
# there, so without this the ViewModel-backed samples render as a missing-dispatcher crash.
kotlinx-coroutines = "1.11.0"
# Material 3 is versioned independently of the Compose Multiplatform BOM; its
# 1.12 line pairs with `compose-multiplatform` 1.12.x. 1.12.0-alpha03 is the
# newest 1.12 release — the line was pinned forward onto an alpha and the next
# releases are 1.13 alphas, which need the 1.13 alpha runtime and, as of
# 1.13.0-alpha02, drop APIs the catalog compiles against: the
# `InsetFocusRingRippleThemeConfiguration` / `OpacityFocusRippleThemeConfiguration`
# focus configurations below, the `BasicAlertDialogOverride` component-override
# API behind `InlineDialogHost`, and the toggle-button / slider shape and
# defaults surface. Moving to 1.13 is a port, not a bump.
#
# The 1.12 line is the first carrying the **keyboard focus indicator** —
# `RippleThemeConfiguration.Focus.InsetRing`, `LocalRippleThemeConfiguration`
# and the `focusRingShape` / `enable*Indication` arguments on `ripple(...)`.
# The kit publishes that ring as its `Focus indicator` utility and Compose had
# nothing to draw it with before, which is why the catalog's focused stickers
# could only ever show the state layer. See `CatalogFocus.kt` and issue #148.
compose-multiplatform-material3 = "1.12.0-alpha03"
# The extended Material icon set is frozen at 1.7.3 upstream (Google stopped
# shipping new releases of it); it is pure icon `ImageVector` definitions, so it
# resolves cleanly alongside the 1.12 line. Only `material-icons-core` — which
# material3 pulls in itself — tracks the main version.
compose-material-icons = "1.7.3"

# Compose Multiplatform Adaptive — `ListDetailPaneScaffold`, `SupportingPaneScaffold` and the
# window-size-class plumbing behind them. Versioned independently of BOTH the Compose Multiplatform
# BOM and material3: the 1.3 line moves on its own cadence (1.3.0 requires the 1.10 Compose
# runtime, which the 1.12 Multiplatform line satisfies). `material3-adaptive-navigation-suite`
# below is the exception — it lives in the material3 group and tracks material3's version.
compose-adaptive = "1.3.0"

materialKolor = "5.0.1"

# compose-ai-tools: the `ee.schimke.composeai.preview` Gradle plugin and the reusable CI
# actions/workflows are one release — keep both pinned together (Renovate groups them; see
# .github/renovate.json).
composePreviewPlugin = "2.35.1"
# The daemon release BOM supplies each annotation and override module's published version.
# These modules are versionless; releases may publish only a subset of them.
composePreviewDaemon = "3.15.0"
composePreviewContracts = "3.20.0"
uiBuilderSource = "3.30.0"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
jb-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jb-lifecycle" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-multiplatform-material3" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
# The adaptive layout surfaces. `adaptive` carries `WindowAdaptiveInfo` and the scaffold directives,
# `adaptive-layout` the pane scaffolds themselves, and `adaptive-navigation` the three-pane
# navigators (`rememberListDetailPaneScaffoldNavigator`) the scaffolds are driven by.
compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "compose-adaptive" }
compose-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "compose-adaptive" }
compose-adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "compose-adaptive" }
# `NavigationSuiteScaffold`. In the material3 group, so it tracks material3's own version rather
# than the adaptive line's.
compose-material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "compose-multiplatform-material3" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
# Republishes the `androidx.compose.ui.tooling.preview.*` surface — `@Preview`
# (the FQN compose-preview's discovery scans for) and `PreviewWrapperProvider` —
# on the desktop JVM target.
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose-multiplatform" }

materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

composeai-contracts-bom = { module = "ee.schimke.composeai:compose-preview-contracts-bom", version.ref = "composePreviewContracts" }
composeai-daemon-bom = { module = "ee.schimke.composeai:compose-preview-daemon-bom", version.ref = "composePreviewDaemon" }
composeai-preview-overrides = { module = "ee.schimke.composeai:data-preview-overrides-runtime" }
composeai-preview-annotations = { module = "ee.schimke.composeai:preview-annotations" }
composeai-ui-builder-renderer-sdk-source = { module = "ee.schimke.composeai:ui-builder-renderer-sdk-source", version.ref = "uiBuilderSource" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composePreview = { id = "ee.schimke.composeai.preview", version.ref = "composePreviewPlugin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
